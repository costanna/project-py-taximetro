[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = [
    "taximetro",
    "main",
    "database",
    "models",
    "schemas",
    "auth",
    "config",
    "logger",
]
